<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Eventos</title>
    <link rel="stylesheet" href="./css/estilos.css">

    <script src="./js/app.js" defer></script>

<body>
    <header>
        <h1 id="titulo">Mis eventos</h1>
        <div class="controles">
            <input type="search" id="buscador" placeholder="Gitano...">
            <button id="ordenarAz">Ordenar A-Z</button>
            <button id="ordenarFecha">Ordenar fecha</button>
        </div>
        <section id="formulario">
            <h2>Crear Evento</h2>
            <label for="nombre">Nombre</label>
            <input type="text" id="nobmre" placeholder="Gitanaco">

            <label for="TipoEvento">TipoEvento</label>
            <select name="TipoEvento" id="TipoEvento"></select>
            <option value="carrera">Carrera</option>
            <option value="gastronomico">Gastronomico</option>
            <option value="pesca">Pesca</option>
           
            <label for="nombre">Nombre</label>
            <input type="text" id="nobmre" placeholder="Gitanaco">

        </section>
        <p id="resumen"></p>
        <p id="estadisticas"></p>
    </header>

    <main id="listado"></main>
